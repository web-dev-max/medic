
services:
  mysql:
    image: mysql:5.7
    container_name: medikom_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./medikompru_new.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: medikom_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      BACKEND_PORT: 3001
      FRONTEND_URL: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medikomplus.ru}
    volumes:
      - backend_uploads:/app/apps/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        API_URL: http://backend:3001
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    container_name: medikom_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:3001
    ports:
      - "80:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
