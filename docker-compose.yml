version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: medikom_mysql
    environment:
      MYSQL_DATABASE: medikompru_new
      MYSQL_USER: medikom
      MYSQL_PASSWORD: medikom
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./medikompru_new.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
