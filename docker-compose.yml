version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: medikom_mysql
    environment:
      MYSQL_DATABASE: medikompru_new
      MYSQL_USER: medikom
      MYSQL_PASSWORD: medikom
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./medikompru_new.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: Backend service (uncomment for Docker deployment)
  # backend:
  #   build: ./apps/backend
  #   container_name: medikom_backend
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_USERNAME: medikom
  #     DB_PASSWORD: medikom
  #     DB_DATABASE: medikompru_new
  #     IMAGE_BASE_URL: /uploads/images
  #     BACKEND_PORT: 3001
  #     FRONTEND_URL: http://localhost:3000
  #   volumes:
  #     - backend_uploads:/app/uploads
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
